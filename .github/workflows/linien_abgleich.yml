name: TramliBern 3.0 Linien-ID Diagnose (JSON)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linien-abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Requests installieren
        run: python -m pip install requests

      - name: Linienkennungen diagnostizieren
        env:
          API_TOKEN: ${{ secrets.OPENTRANSPORT_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from collections import Counter, defaultdict
          from datetime import datetime, timezone

          import requests

          STOPS = [
              'Bern, Giacomettistrasse',
              'Bern, Ostring',
              'Bern, Zentrum Paul Klee',
              'Bern, Burgernziel',
              'Bern, Brunnadernstrasse',
          ]
          SLOIDS = {
              'Bern, Giacomettistrasse': 'ch:1:sloid:90090',
              'Bern, Ostring': 'ch:1:sloid:87480',
              'Bern, Zentrum Paul Klee': 'ch:1:sloid:90127',
              'Bern, Burgernziel': 'ch:1:sloid:87481',
              'Bern, Brunnadernstrasse': 'ch:1:sloid:7061',
          }
          AGENCY_HINT = '827'  # Aus vorherigem Diagnoselauf; kein offizieller Mapping-Nachweis.
          GTFS_URL = 'https://api.opentransportdata.swiss/la/gtfs-sa'
          STATIONBOARD_URL = 'https://transport.opendata.ch/v1/stationboard'
          token = os.environ.get('API_TOKEN', '').strip()
          if not token:
              raise SystemExit('FEHLER: GitHub Secret OPENTRANSPORT_API_TOKEN fehlt.')

          session = requests.Session()
          session.headers.update({'User-Agent': 'TramliBern-Linien-Diagnose/3.0'})

          print('=== TRAMLIBERN 3.0: LINIEN-ID-DIAGNOSE (NUR LESEN) ===', flush=True)
          print('UTC:', datetime.now(timezone.utc).isoformat(), flush=True)
          print('\n1) Aktuelle Linien pro Haltestelle (transport.opendata.ch)', flush=True)
          all_lines = set()
          for stop in STOPS:
              try:
                  r = session.get(STATIONBOARD_URL, params={
                      'station': stop,
                      'limit': 30,
                      'fields[]': ['stationboard/category', 'stationboard/number'],
                  }, timeout=25)
                  r.raise_for_status()
                  board = r.json().get('stationboard', [])
                  lines = sorted({
                      (str(d.get('category') or '').strip(), str(d.get('number') or '').strip())
                      for d in board if isinstance(d, dict) and d.get('number')
                  })
                  all_lines.update(lines)
                  print(f'  {stop} | {SLOIDS[stop]} | Linien: {lines or "keine im Antwortfenster"}', flush=True)
              except (requests.RequestException, ValueError) as exc:
                  print(f'  {stop} | Abfrage fehlgeschlagen: {type(exc).__name__}: {exc}', flush=True)

          print('\n2) Offizielle GTFS-SA-Meldungen als JSON abfragen', flush=True)
          try:
              response = session.get(
                  GTFS_URL,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/json',
                  },
                  params={'format': 'json'},
                  timeout=120,
              )
              print('  HTTP:', response.status_code, flush=True)
              print('  Content-Type:', response.headers.get('Content-Type', ''), flush=True)
              print('  Bytes:', len(response.content), flush=True)
              response.raise_for_status()
              try:
                  payload = response.json()
              except ValueError:
                  raise SystemExit('FEHLER: API lieferte kein JSON. Erste Bytes (Hex): ' + response.content[:20].hex())
              if not isinstance(payload, dict) or not isinstance(payload.get('entity'), list):
                  raise SystemExit('FEHLER: Unerwartete JSON-Struktur; entity-Liste fehlt.')
          except requests.RequestException as exc:
              raise SystemExit('FEHLER beim API-Aufruf: ' + type(exc).__name__ + ': ' + str(exc))

          entities = payload['entity']
          print('  Meldungseintraege gesamt:', len(entities), flush=True)

          def translations(obj):
              if not isinstance(obj, dict):
                  return []
              result = []
              for item in obj.get('translation') or []:
                  if isinstance(item, dict) and isinstance(item.get('text'), str):
                      result.append((str(item.get('language') or ''), item['text']))
              return result

          def summary_text(alert):
              items = translations(alert.get('headerText')) or translations(alert.get('descriptionText'))
              for language, value in items:
                  if language.lower().startswith('de'):
                      return re.sub(r'\s+', ' ', value).strip()[:180]
              return re.sub(r'\s+', ' ', items[0][1]).strip()[:180] if items else '(kein Meldungstext)'

          def is_active(alert, now):
              periods = alert.get('activePeriod') or []
              if not periods:
                  return True
              for period in periods:
                  if not isinstance(period, dict):
                      continue
                  try:
                      start = int(period.get('start') or 0)
                      end = int(period.get('end') or 0)
                      if (not start or start <= now) and (not end or now <= end):
                          return True
                  except (TypeError, ValueError):
                      continue
              return False

          now = int(datetime.now(timezone.utc).timestamp())
          route_counts = Counter()
          agency_counts = Counter()
          matches = defaultdict(list)
          route_only = []
          alert_count = 0
          agency_alerts = 0
          for entity in entities:
              if not isinstance(entity, dict):
                  continue
              alert = entity.get('alert')
              if not isinstance(alert, dict) or not is_active(alert, now):
                  continue
              alert_count += 1
              selectors = [s for s in (alert.get('informedEntity') or []) if isinstance(s, dict)]
              for s in selectors:
                  agency = str(s.get('agencyId') or '')
                  if agency:
                      agency_counts[agency] += 1
              related = [s for s in selectors if str(s.get('agencyId') or '') == AGENCY_HINT]
              if not related:
                  continue
              agency_alerts += 1
              ids = {str(s.get('routeId')) for s in related if s.get('routeId') is not None}
              for route in ids:
                  route_counts[route] += 1
              stops = {str(s.get('stopId')) for s in related if s.get('stopId')}
              text = summary_text(alert)
              record = (str(entity.get('id') or '')[:70], sorted(ids), text)
              if not stops and ids:
                  route_only.append(record)
              for name, sloid in SLOIDS.items():
                  if any(stop_id == sloid or stop_id.startswith(sloid + ':') for stop_id in stops):
                      matches[name].append(record)

          print('\n3) Meldungskennungen (AGENCY 827 ist nur ein Diagnose-Hinweis)', flush=True)
          print('  Aktive Alerts aller Betreiber:', alert_count, flush=True)
          print('  Agency-827-Alerts:', agency_alerts, flush=True)
          print('  Haeufigste Betreiberkennungen:', agency_counts.most_common(12), flush=True)
          print('  Route-IDs bei Agency 827:', route_counts.most_common(35), flush=True)
          print('  Agency-827-Meldungen nur mit routeId, ohne stopId:', len(route_only), flush=True)
          print('\n4) Haltestellenbezogene Treffermeldungen', flush=True)
          for stop in STOPS:
              records = matches[stop]
              print(f'  {stop}: {len(records)} Treffer', flush=True)
              for entry_id, routes, message in records[:5]:
                  print(f'    id={entry_id} routeId={routes} text={message}', flush=True)

          print('\n5) Beispiele fuer routeId-only-Meldungen (KEINE automatische Linienzuordnung!)', flush=True)
          for entry_id, routes, message in route_only[:12]:
              print(f'  id={entry_id} routeId={routes} text={message}', flush=True)

          print('\nERGEBNIS: JSON erfolgreich ausgewertet. Die Zuordnung routeId -> Liniennummer', flush=True)
          print('muss vor einer Display-Warnung anhand offizieller GTFS-Stammdaten geprueft werden.', flush=True)
          print('Version 2.9 und GitHub Pages wurden NICHT veraendert.', flush=True)
          PY

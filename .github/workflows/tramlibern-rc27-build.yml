name: TramliBern RC27 - compile ESP32
on:
  push:
    branches:
      - test/tramlibern-4.0-rc27-build
    paths:
      - RC27_SOURCE_UPLOAD.zip
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded RC27 source archive
        run: |
          test -s RC27_SOURCE_UPLOAD.zip || { echo "::error::Missing RC27_SOURCE_UPLOAD.zip"; exit 1; }
          mkdir -p src
          unzip -q RC27_SOURCE_UPLOAD.zip -d src
          test -s src/TramliBern/TramliBern.ino
          test -s src/TramliBern/partitions.csv
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "GFX Library for Arduino@1.6.0"
          arduino-cli lib install "XPT2046_Touchscreen@1.4"
      - name: Compile original RC27 sources
        run: |
          mkdir -p build
          arduino-cli compile --jobs 1 --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --output-dir build --export-binaries src/TramliBern
      - name: Check OTA capacity
        run: |
          test -s build/TramliBern.ino.bin
          bytes=$(stat -c '%s' build/TramliBern.ino.bin)
          echo "Firmware size: $bytes bytes; OTA slot: 1966080 bytes"
          test "$bytes" -le 1966080
      - name: Package output
        run: |
          mkdir -p deliver
          cp build/TramliBern.ino.bin deliver/TramliBern_RC27.ino.bin
          sha256sum deliver/TramliBern_RC27.ino.bin > deliver/SHA256SUMS.txt
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TramliBern_RC27_compiled_bin
          path: deliver/
          if-no-files-found: error

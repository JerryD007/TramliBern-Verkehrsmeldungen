name: TramliBern RC27 – ESP32 compile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require RC27 firmware sources
        run: |
          test -f TramliBern/TramliBern.ino || { echo "::error::RC27 sources are not yet present on this test branch"; exit 1; }
          test -f TramliBern/partitions.csv
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "GFX Library for Arduino@1.6.0"
          arduino-cli lib install "XPT2046_Touchscreen@1.4"
      - name: Compile RC27
        run: |
          mkdir -p build
          arduino-cli compile -b esp32:esp32:esp32:PartitionScheme=min_spiffs,FlashSize=4M,FlashMode=qio,FlashFreq=40 --export-binaries --output-dir build TramliBern
      - name: Confirm OTA partition capacity
        run: |
          test -f build/TramliBern.ino.bin
          bytes=$(stat -c '%s' build/TramliBern.ino.bin)
          echo "Firmware: $bytes bytes; OTA slot: 1966080 bytes"
          test "$bytes" -le 1966080
      - name: Upload directly usable firmware
        uses: actions/upload-artifact@v4
        with:
          name: TramliBern_RC27_ino_bin
          path: build/TramliBern.ino.bin
          if-no-files-found: error

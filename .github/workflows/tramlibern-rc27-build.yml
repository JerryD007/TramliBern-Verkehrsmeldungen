name: TramliBern RC28 OTA password recovery (USB)
on:
  push:
    branches:
      - test/tramlibern-rc28-ota-password-recovery
    paths:
      - .github/workflows/tramlibern-rc27-build.yml
      - .github/ota_recovery_patch.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract preserved RC27 base
        run: |
          test -s RC27_SOURCE_UPLOAD.zip
          mkdir src
          unzip -q RC27_SOURCE_UPLOAD.zip -d src
          test -s src/TramliBern/TramliBern.ino
          test -s src/TramliBern/partitions.csv
      - name: Apply exactly RC28 and one-shot OTA recovery (NO RC29 changes)
        run: |
          python3 .github/rc28_patch.py src/TramliBern/TramliBern.ino
          python3 .github/ota_recovery_patch.py src/TramliBern/TramliBern.ino
          grep -q 'otaRecDone1' src/TramliBern/TramliBern.ino
          if grep -q 'showWifiQR' src/TramliBern/TramliBern.ino; then echo 'Unexpected RC29 QR code in recovery' && exit 1; fi
      - uses: arduino/setup-arduino-cli@v2
      - name: Install exact dependencies
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "GFX Library for Arduino@1.6.0"
          arduino-cli lib install "XPT2046_Touchscreen@1.4"
      - name: Compile recovery
        run: |
          mkdir -p build
          arduino-cli compile --jobs 1 --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --output-dir build --export-binaries src/TramliBern
      - name: Assert capacity and package all exact compiled sources
        run: |
          test -s build/TramliBern.ino.bin
          bytes=$(stat -c '%s' build/TramliBern.ino.bin)
          echo "BIN_BYTES=$bytes"
          echo "OTA_SLOT=1966080"
          test "$bytes" -le 1966080
          mkdir -p deliver/ArduinoSource
          cp -a src/TramliBern/. deliver/ArduinoSource/
          cp build/TramliBern.ino.bin deliver/TramliBern_RC28_OTA_RECOVERY.ino.bin
          sha256sum deliver/TramliBern_RC28_OTA_RECOVERY.ino.bin > deliver/SHA256SUMS.txt
          echo "Build SHA: $GITHUB_SHA" > deliver/BUILD_INFO.txt
          echo "Restores only OTA password via one-shot boot flag; requires USB flash; no other settings erased." >> deliver/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TramliBern_RC28_OTA_RECOVERY_verified
          path: deliver/
          if-no-files-found: error

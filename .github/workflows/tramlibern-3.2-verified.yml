name: TramliBern 3.2 verification and firmware
on:
  push:
    branches: ['test/tramlibern-3.2-verified']
    paths-ignore: ['data/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tramlibern-32-verified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v
  live:
    needs: regressions
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python ci/live_gtfs_diagnostic.py
        env:
          OPENTRANSPORT_API_TOKEN: ${{ secrets.OPENTRANSPORT_API_TOKEN }}
      - name: Diagnose protobuf freshness if the JSON live check fails
        if: failure()
        continue-on-error: true
        run: python ci/probe_protobuf.py
        env:
          OPENTRANSPORT_API_TOKEN: ${{ secrets.OPENTRANSPORT_API_TOKEN }}
      - name: Publish short-lived test feed on this test branch only
        if: success() && github.ref == 'refs/heads/test/tramlibern-3.2-verified'
        run: |
          mkdir -p data
          cp reports/alerts-v2.json data/alerts-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/alerts-v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified 3.2 test feed'
            git push origin HEAD:refs/heads/test/tramlibern-3.2-verified
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-gtfs-evidence
          path: reports/
          retention-days: 14
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - run: bash ci/install.sh
      - run: bash ci/compile.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-and-memory
          path: reports/
          retention-days: 30

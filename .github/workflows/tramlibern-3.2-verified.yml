name: TramliBern 3.2 verification and firmware
on:
  push:
    branches: ['test/tramlibern-3.2-verified']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python ci/live_gtfs_diagnostic.py
        env:
          OPENTRANSPORT_API_TOKEN: ${{ secrets.OPENTRANSPORT_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-gtfs-evidence
          path: reports/
          retention-days: 14
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - run: bash ci/install.sh
      - run: bash ci/compile.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-and-memory
          path: reports/
          retention-days: 30

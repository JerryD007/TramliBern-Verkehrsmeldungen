name: RundeUhr RC22 tests
on:
  push:
    branches: ['test/rundeuhr-rc22']
    paths: ['RundeUhrWeb/**', '.github/workflows/rundeuhr-web.yml']
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 and pinned libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli lib install --no-deps 'Adafruit GFX Library@1.12.1' 'Adafruit GC9A01A@1.1.0' 'Adafruit BusIO@1.17.2' 'ArduinoJson@7.4.2'
      - name: Host logic and migration tests
        working-directory: RundeUhrWeb
        run: |
          mkdir -p build
          GFX_DIR="$HOME/Arduino/libraries/Adafruit_GFX_Library" bash tools/build_thumbs.sh
          git diff --exit-code -- web/thumbs.json RundeUhr/WebApp.h preview/App.html
          g++ -std=c++17 -I "$HOME/Arduino/libraries/ArduinoJson/src" tests/web_logic_test.cpp -o build/web_logic
          build/web_logic
          g++ -std=c++17 -I "$HOME/Arduino/libraries/ArduinoJson/src" tests/iss_test.cpp -o build/iss_test
          build/iss_test
          g++ -std=c++17 -DARDUINO=10819 -I tests/host -I "$HOME/Arduino/libraries/Adafruit_GFX_Library" tests/iss_render_test.cpp "$HOME/Arduino/libraries/Adafruit_GFX_Library/Adafruit_GFX.cpp" -o build/iss_render
          build/iss_render
          g++ -std=c++17 -I "$HOME/Arduino/libraries/ArduinoJson/src" tests/quake_test.cpp -o build/quake_test
          build/quake_test
          g++ -std=c++17 -DARDUINO=10819 -I tests/host -I "$HOME/Arduino/libraries/Adafruit_GFX_Library" tests/quake_render_test.cpp "$HOME/Arduino/libraries/Adafruit_GFX_Library/Adafruit_GFX.cpp" -o build/quake_render
          build/quake_render
          g++ -std=c++17 -I "$HOME/Arduino/libraries/ArduinoJson/src" tests/launch_test.cpp -o build/launch_test
          build/launch_test
          g++ -std=c++17 -DARDUINO=10819 -I tests/host -I "$HOME/Arduino/libraries/Adafruit_GFX_Library" tests/launch_render_test.cpp "$HOME/Arduino/libraries/Adafruit_GFX_Library/Adafruit_GFX.cpp" -o build/launch_render
          build/launch_render
          python3 tests/launch_scheduler_test.py
          python3 tests/deferred_scheduler_test.py
          python3 tests/receive_scratch_test.py
          g++ -std=c++17 -I "$HOME/Arduino/libraries/ArduinoJson/src" tests/weather_live_test.cpp -o build/weather_live_test
          g++ -std=c++17 -fsanitize=address,undefined -I tests/host -I "$HOME/Arduino/libraries/ArduinoJson/src" tests/body_test.cpp -o build/body_test
          build/body_test
          g++ -std=c++17 -I tests/host -I "$HOME/Arduino/libraries/ArduinoJson/src" tests/news_test.cpp -o build/news_test
          build/news_test
          g++ -std=c++17 -I "$HOME/Arduino/libraries/ArduinoJson/src" tests/event_test.cpp -o build/event_test
          build/event_test
          g++ -std=c++17 -DARDUINO=10819 -I tests/host -I "$HOME/Arduino/libraries/Adafruit_GFX_Library" tests/news_render_test.cpp "$HOME/Arduino/libraries/Adafruit_GFX_Library/Adafruit_GFX.cpp" -o build/news_render_test
          build/news_render_test
          python3 tests/tls_fragmentation_test.py
          python3 tests/fleet_cors_test.py
          g++ -std=c++17 tests/weekend_transition_test.cpp -o build/weekend_transition
          build/weekend_transition
          g++ -std=c++17 -DARDUINO=10819 -I tests/host -I "$HOME/Arduino/libraries/Adafruit_GFX_Library" tests/weekend_render_test.cpp "$HOME/Arduino/libraries/Adafruit_GFX_Library/Adafruit_GFX.cpp" -o build/weekend_render
          build/weekend_render
          GFX_DIR="$HOME/Arduino/libraries/Adafruit_GFX_Library" JSON_DIR="$HOME/Arduino/libraries/ArduinoJson/src" bash tests/run_finance.sh
          GFX_DIR="$HOME/Arduino/libraries/Adafruit_GFX_Library" JSON_DIR="$HOME/Arduino/libraries/ArduinoJson/src" bash tests/run_aircraft.sh
          GFX_DIR="$HOME/Arduino/libraries/Adafruit_GFX_Library" bash tests/run_layout.sh
          g++ -std=c++17 -DARDUINO=10819 -I tests/host -I "$HOME/Arduino/libraries/Adafruit_GFX_Library" tests/design_preview.cpp "$HOME/Arduino/libraries/Adafruit_GFX_Library/Adafruit_GFX.cpp" -o build/design_preview
          build/design_preview
          GFX_DIR="$HOME/Arduino/libraries/Adafruit_GFX_Library" JSON_DIR="$HOME/Arduino/libraries/ArduinoJson/src" bash tests/run_sky.sh
      - name: Verify live finance APIs and TLS roots
        working-directory: RundeUhrWeb
        run: |
          curl --fail --retry 2 --max-time 25 --cacert certificates/finance_roots.pem 'https://api.coinbase.com/v2/prices/BTC-CHF/spot' -o tests/live_btc.json
          curl --fail --retry 2 --max-time 25 --cacert certificates/finance_roots.pem 'https://api.frankfurter.dev/v2/rate/CHF/CZK' -o tests/live_fx.json
          curl --fail --retry 2 --max-time 25 --cacert certificates/finance_roots.pem 'https://opendata.adsb.fi/api/v3/lat/46.948/lon/7.4474/dist/27' -o tests/live_aircraft.json
          curl --fail --retry 2 --max-time 25 --cacert certificates/finance_roots.pem https://api.adsbdb.com/v0/callsign/SWR5GT -o /tmp/route-live.json
          python3 -c 'import json; r=json.load(open("/tmp/route-live.json"))["response"]["flightroute"]; assert r["callsign_icao"]=="SWR5GT" and r["destination"].get("name"); print("PASS live ADSBDB schema and TLS with shipped CA bundle")'
          curl --fail --retry 2 --max-time 25 --cacert certificates/finance_roots.pem https://api.wheretheiss.at/v1/satellites/25544 -o tests/live_iss.json
          curl --fail --retry 2 --max-time 25 --cacert certificates/finance_roots.pem https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson -o tests/live_quake.json
          build/quake_test tests/live_quake.json
          curl --fail --max-time 25 --cacert certificates/finance_roots.pem 'https://ll.thespacedevs.com/2.3.0/launches/upcoming/?limit=3&mode=list' -o tests/live_launch.json
          build/launch_test tests/live_launch.json
          curl --fail --max-time 30 --cacert certificates/finance_roots.pem 'https://www.tagesschau.de/infoservices/alle-meldungen-100~rss2.xml' -o /tmp/news.xml
          build/news_test /tmp/news.xml
          python3 tests/check_live.py
          python3 tests/check_aircraft_live.py
      - name: Verify live weather HTTPS and firmware parser
        working-directory: RundeUhrWeb
        run: python3 tests/check_weather_tls.py
      - name: Compile ESP32-C3
        working-directory: RundeUhrWeb
        run: |
          arduino-cli compile --jobs 4 --fqbn 'esp32:esp32:esp32c3:CDCOnBoot=cdc,FlashSize=4M,PartitionScheme=min_spiffs,FlashMode=dio,FlashFreq=40,UploadSpeed=115200' --output-dir build RundeUhr 2>&1 | tee build/compile.log
          python3 tests/verify_binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: RundeUhr-3.2.0-rc22
          path: |
            RundeUhrWeb/build/RundeUhr.ino.bin
            RundeUhrWeb/build/compile.log
            RundeUhrWeb/tests/live_*.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install playwright@1.58.2
          npx playwright install --with-deps webkit chromium
      - name: Browser tests (simulated ESP API)
        working-directory: RundeUhrWeb
        run: |
          node tests/web_browser_test.cjs 2>&1 | tee tests/browser_ci.log
          node tests/fleet_browser_test.cjs 2>&1 | tee tests/fleet_browser_ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RundeUhr-Web-tests
          path: |
            RundeUhrWeb/tests/*.png
            RundeUhrWeb/tests/browser_ci.log

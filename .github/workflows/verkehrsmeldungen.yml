name: TramliBern Verkehrsmeldungen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gtfs-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Bibliotheken installieren
        run: python -m pip install requests gtfs-realtime-bindings

      - name: Schweizer Verkehrsmeldungen testen
        env:
          API_TOKEN: ${{ secrets.OPENTRANSPORT_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import gzip
          import requests
          from google.protobuf.message import DecodeError
          from google.transit import gtfs_realtime_pb2

          token = os.environ.get("API_TOKEN", "").strip()
          if not token:
              raise SystemExit("FEHLER: GitHub Secret fehlt.")

          url = "https://api.opentransportdata.swiss/la/gtfs-sa"
          headers = {
              "Authorization": "Bearer " + token,
              "User-Agent": "TramliBern-ESP32",
             "Accept": "application/octet-stream",
             "Accept-Encoding": "gzip, deflate",
          }

          print("TramliBern GTFS-SA Test", flush=True)

          try:
              response = requests.get(
                  url, headers=headers, timeout=90
              )
              print("HTTP:", response.status_code, flush=True)
              print(
                  "Datenformat:",
                  response.headers.get("Content-Type", "unbekannt"),
                  flush=True
              )
              response.raise_for_status()
          except requests.RequestException as exc:
              raise SystemExit(
                  "FEHLER beim API-Abruf: " + str(exc)
              )

          data = response.content
          print("Dateigroesse:", len(data), "Bytes", flush=True)
          print("Erste Bytes:", data[:24].hex(), flush=True)

          if data.startswith(b"\x1f\x8b"):
              print("GZIP-Daten erkannt.", flush=True)
              data = gzip.decompress(data)

          if data.startswith(b"PK\x03\x04"):
              raise SystemExit(
                  "Antwort ist ein ZIP-Archiv, kein GTFS-Protobuf."
              )

          if data.lstrip().startswith((b"{", b"[")):
              print("Antwort sieht nach JSON aus.", flush=True)
              print(
                  "JSON-Anfang:",
                  data[:160].decode("utf-8", errors="replace"),
                  flush=True
              )
              raise SystemExit(
                  "GTFS-SA wurde als JSON statt Protobuf geliefert."
              )

          if data.lstrip().startswith(b"<"):
              raise SystemExit(
                  "Antwort sieht nach HTML oder XML aus."
              )

          feed = gtfs_realtime_pb2.FeedMessage()
          try:
              feed.ParseFromString(data)
          except DecodeError:
              raise SystemExit(
                  "Antwort konnte nicht als GTFS-Protobuf "
                  "gelesen werden. Datenformat und erste "
                  "Bytes oben kontrollieren."
              )

          alerts = [
              entity.alert
              for entity in feed.entity
              if entity.HasField("alert")
          ]

          print("GTFS-Protobuf erfolgreich gelesen!", flush=True)
          print("Anzahl Verkehrsmeldungen:", len(alerts), flush=True)
          print(
              "Naechster Schritt: BERNMOBIL-Meldungen "
              "und Haltestellen filtern.",
              flush=True
          )
          PY

name: TramliBern Haltestellen-ID Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  haltestellen-test:
    runs-on: ubuntu-latest
    steps:
      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Requests installieren
        run: python -m pip install requests
      - name: Fuenf Haltestellen suchen
        run: |
          python - <<'PY'
          import requests
          import unicodedata

          names = [
              'Bern, Giacomettistrasse',
              'Bern, Ostring',
              'Bern, Zentrum Paul Klee',
              'Bern, Burgernziel',
              'Bern, Brunnadernstrasse',
          ]

          def normalize(value):
              value = unicodedata.normalize('NFKD', value.casefold())
              return ''.join(ch for ch in value if ch.isalnum())

          session = requests.Session()
          print('=== TramliBern: Haltestellen-ID-Diagnose ===', flush=True)
          for name in names:
              print('\nGESUCHT:', name, flush=True)
              try:
                  response = session.get(
                      'https://transport.opendata.ch/v1/locations',
                      params={'query': name, 'type': 'station'},
                      timeout=30,
                  )
                  print('HTTP:', response.status_code, flush=True)
                  response.raise_for_status()
                  stations = response.json().get('stations') or []
                  exact = [s for s in stations if normalize(s.get('name') or '') == normalize(name)]
                  print('Exakte Namens-Treffer:', len(exact), flush=True)
                  choices = exact if exact else stations[:5]
                  for station in choices[:5]:
                      if not isinstance(station, dict):
                          continue
                      print('  Name:', station.get('name'), flush=True)
                      print('  Stations-ID:', station.get('id'), flush=True)
                      print('  Position:', station.get('coordinate'), flush=True)
                  if not choices:
                      print('  Kein Treffer. Manuelle Kontrolle erforderlich.', flush=True)
                  elif not exact:
                      print('  ACHTUNG: Nur aehnliche Treffer; nicht automatisch zuordnen.', flush=True)
              except (requests.RequestException, ValueError) as exc:
                  print('  FEHLER:', type(exc).__name__, str(exc)[:200], flush=True)
          print('\nHINWEIS: Die Stations-ID ist nicht automatisch die GTFS-SA stopId/SLOID.', flush=True)
          print('Naechster Schritt: Stations-IDs mit offiziellen GTFS-Stammdaten abgleichen.', flush=True)
          PY

name: TramliBern 2.9 Meldungen TEST

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  erstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Requests installieren
        run: python -m pip install requests
      - name: SLOID-Katalog und Diagnosemeldungen erzeugen
        env:
          API_TOKEN: ${{ secrets.OPENTRANSPORT_API_TOKEN }}
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import os
          from pathlib import Path
          import re
          import time
          import requests

          TOKEN = os.environ.get('API_TOKEN', '').strip()
          if not TOKEN:
              raise SystemExit('GitHub Secret OPENTRANSPORT_API_TOKEN fehlt.')
          SBB_URL = ('https://data.sbb.ch/api/v2/catalog/datasets/'
                     'dienststellen-gemass-opentransportdataswiss/exports/csv?use_labels=false')
          GTFS_URL = 'https://api.opentransportdata.swiss/la/gtfs-sa/?format=json'
          site = Path('_site')
          (site / 'ids').mkdir(parents=True, exist_ok=True)

          # Stationsnummer (DiDok) und SLOID werden nicht aus Zahlentext geraten.
          response = requests.get(SBB_URL, timeout=120)
          print('DiDok HTTP:', response.status_code, flush=True)
          response.raise_for_status()
          response.encoding = 'utf-8-sig'
          reader = csv.DictReader(io.StringIO(response.text), delimiter=';')
          if not reader.fieldnames or 'number' not in reader.fieldnames or 'sloid' not in reader.fieldnames:
              raise SystemExit('DiDok-Spalten number/sloid nicht gefunden; Exportformat pruefen.')
          lookups = {}
          ambiguous = set()
          for row in reader:
              station_id = str(row.get('number') or '').strip()
              sloid = str(row.get('sloid') or '').strip()
              if not station_id.isdigit() or not re.fullmatch(r'ch:1:sloid:\d+', sloid):
                  continue
              if station_id in lookups and lookups[station_id] != sloid:
                  ambiguous.add(station_id)
              else:
                  lookups[station_id] = sloid
          for station_id in ambiguous:
              lookups.pop(station_id, None)
          if len(lookups) < 10000:
              raise SystemExit('Zu wenig eindeutige Stationsnummern; Export kontrollieren.')
          for bucket in range(256):
              selected = {k:v for k,v in lookups.items() if int(k) % 256 == bucket}
              (site / 'ids' / f'{bucket:02x}.json').write_text(
                  json.dumps(selected, separators=(',',':'), ensure_ascii=False), encoding='utf-8')
          print('Eindeutige Stationsnummern:', len(lookups), 'unklar:', len(ambiguous))

          # ACHTUNG: JSON-Repräsentation nur DIAGNOSE – noch kein Zeitplan/Dauerbetrieb.
          response = requests.get(GTFS_URL, headers={
              'Authorization': 'Bearer ' + TOKEN,
              'Accept': 'application/json',
              'User-Agent': 'TramliBern-GitHub-2.9-Test',
          }, timeout=120)
          print('GTFS-SA HTTP:', response.status_code, flush=True)
          response.raise_for_status()
          payload = response.json()
          if not isinstance(payload, dict) or not isinstance(payload.get('entity'), list):
              raise SystemExit('Unerwartete GTFS-SA JSON-Struktur.')
          now = int(time.time())

          def active_period(alert):
              periods = alert.get('activePeriod') or []
              if not periods:
                  return True, 0
              for p in periods:
                  if not isinstance(p, dict):
                      continue
                  try:
                      start = int(p.get('start') or 0)
                      end = int(p.get('end') or 0)
                  except (TypeError, ValueError):
                      continue
                  if start <= now and (not end or end >= now):
                      return True, end
              return False, 0

          def german(field):
              translations = (field.get('translation') or []) if isinstance(field, dict) else []
              if not isinstance(translations, list):
                  return ''
              texts = [t for t in translations if isinstance(t, dict) and isinstance(t.get('text'), str)]
              for lang in ('de', 'de-CH', 'de_CH'):
                  for t in texts:
                      if t.get('language') == lang:
                          return t['text']
              return texts[0]['text'] if texts else ''

          alerts = []
          skipped_route_only = 0
          for entity in payload['entity']:
              alert = entity.get('alert') if isinstance(entity, dict) else None
              if not isinstance(alert, dict):
                  continue
              valid, until = active_period(alert)
              if not valid:
                  continue
              selectors = alert.get('informedEntity') or []
              if not isinstance(selectors, list):
                  continue
              relevant = [s for s in selectors if isinstance(s, dict) and str(s.get('agencyId', '')) == '827']
              if not relevant:
                  continue
              stops = sorted({str(s['stopId']) for s in relevant if
                              isinstance(s.get('stopId'), str) and
                              re.fullmatch(r'ch:1:sloid:\d+(?::\d+)*', s['stopId'])})
              if not stops:
                  skipped_route_only += 1
                  continue
              title = german(alert.get('headerText')) or german(alert.get('descriptionText'))
              title = re.sub(r'\s+', ' ', title).strip()
              if not title:
                  continue
              alerts.append({'stops': stops, 'text': title[:160], 'end': until})

          # Keine stillschweigende Datenkuerzung bei aussergewoehnlich grossem Feed.
          final = json.dumps({'generated': now, 'alerts': alerts}, separators=(',', ':'), ensure_ascii=False)
          if len(final.encode('utf-8')) > 22000:
              raise SystemExit('alerts.json groesser als ESP32-Buffer; gezielte Aufteilung erforderlich.')
          (site / 'alerts.json').write_text(final, encoding='utf-8')
          (site / 'index.html').write_text('<meta charset="utf-8"><title>TramliBern Diagnose</title><p>TramliBern Testdaten. Keine oeffentliche Statusgarantie.</p>', encoding='utf-8')
          (site / '.nojekyll').write_text('', encoding='utf-8')
          print('Aktuelle stopId-Meldungen:', len(alerts))
          print('Nicht automatisch zugeordnete Linienmeldungen:', skipped_route_only)
          print('JSON-Bytes:', len(final.encode('utf-8')))
          print('Zeitstempel UTC:', now)
          PY
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Daten als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Testseite veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

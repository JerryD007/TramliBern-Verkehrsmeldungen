name: TramliBern JSON Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-test:
    runs-on: ubuntu-latest

    steps:
      - name: Python vorbereiten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Requests installieren
        run: python -m pip install requests

      - name: Schweizer GTFS-SA JSON testen
        env:
          API_TOKEN: ${{ secrets.OPENTRANSPORT_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("API_TOKEN", "").strip()
          if not token:
              raise SystemExit("FEHLER: GitHub Secret fehlt.")

          url = "https://api.opentransportdata.swiss/la/gtfs-sa/?format=json"
          headers = {
              "Authorization": "Bearer " + token,
              "User-Agent": "TramliBern-JSON-Diagnose",
              "Accept": "application/json",
              "Accept-Encoding": "gzip, deflate",
          }

          print("=== TramliBern JSON-Diagnosetest ===", flush=True)

          try:
              response = requests.get(
                  url, headers=headers, timeout=120,
                  allow_redirects=True
              )
              print("HTTP:", response.status_code, flush=True)
              print("Datenformat:", response.headers.get("Content-Type"), flush=True)
              print("Dateigroesse:", len(response.content), "Bytes", flush=True)
              response.raise_for_status()
          except requests.RequestException as exc:
              raise SystemExit("API-Fehler: " + str(exc))

          try:
              data = response.json()
          except ValueError:
              print("Antwortanfang (Hex):", response.content[:24].hex())
              raise SystemExit("FEHLER: Antwort ist kein gueltiges JSON.")

          print("JSON erfolgreich gelesen!", flush=True)
          print("Oberster Datentyp:", type(data).__name__, flush=True)

          if isinstance(data, dict):
              print("Hauptfelder:", list(data.keys())[:20], flush=True)
              entities = data.get("entity")
              if entities is None:
                  entities = data.get("Entity")

              if isinstance(entities, list):
                  print("Anzahl Eintraege:", len(entities), flush=True)
                  if entities and isinstance(entities[0], dict):
                      print(
                          "Felder des ersten Eintrags:",
                          list(entities[0].keys())[:20],
                          flush=True
                      )
              else:
                  print("Kein direktes entity-Array gefunden.", flush=True)

          elif isinstance(data, list):
              print("Anzahl Eintraege:", len(data), flush=True)

          print("Diagnose abgeschlossen.", flush=True)
          PY



3. Datei speichern und Test starten

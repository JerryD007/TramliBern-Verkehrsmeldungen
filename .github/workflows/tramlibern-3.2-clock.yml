# Retired on 2026-10-25 at the owner's request: stop obsolete alert-feed failure emails.
# The SLIM firmware does not use this service. No automatic triggers remain.
# Keep manual dispatch as a harmless skipped job for any old external cron caller.
name: TramliBern 3.2 test feed clock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Retired - SLIM firmware uses no alert feed.'

# Authorized scheduler: data is written only to the isolated test branch.
name: TramliBern 3.2 test feed clock
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/tramlibern-3.2-clock.yml']
  # Independent fallback from the existing scheduled workflow; it is not modified.
  workflow_run:
    workflows: ['TramliBern 2.9 Meldungen TEST']
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  refresh_test_branch:
    uses: JerryD007/TramliBern-Verkehrsmeldungen/.github/workflows/tramlibern-3.2-refresh.yml@test/tramlibern-3.2-verified
    secrets:
      OPENTRANSPORT_API_TOKEN: ${{ secrets.OPENTRANSPORT_API_TOKEN }}

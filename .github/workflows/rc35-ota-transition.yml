name: TramliBern RC35 HomeCross - OTA no password
on:
  push:
    branches:
      - test/tramlibern-rc35-ota-transition
    paths:
      - .github/rc35_version_only.py
      - .github/workflows/rc35-ota-transition.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original RC27 and apply verified RC28/RC29/RC35 modifications
        run: |
          mkdir -p src
          unzip -q RC27_SOURCE_UPLOAD.zip -d src
          test -s src/TramliBern/TramliBern.ino
          python3 .github/rc28_patch.py src/TramliBern/TramliBern.ino
          python3 .github/rc29_patch.py src/TramliBern/TramliBern.ino
          python3 .github/rc30_noauth_patch.py src/TramliBern/TramliBern.ino
          python3 .github/rc31_ota_progress.py src/TramliBern/TramliBern.ino
          python3 .github/rc32_web_dashboard.py src/TramliBern/TramliBern.ino
          python3 .github/rc33_rename_panel.py src/TramliBern/TramliBern.ino
          python3 .github/rc34_ota_verify.py src/TramliBern/TramliBern.ino
          python3 .github/rc35_version_only.py src/TramliBern/TramliBern.ino
          grep -q 'TramliBern 4.0 RC35 OTA-TEST' src/TramliBern/TramliBern.ino
          grep -q 'otaPendingAddr' src/TramliBern/TramliBern.ino
          grep -q 'ota/status' src/TramliBern/TramliBern.ino
          if grep -q '<iframe' src/TramliBern/TramliBern.ino; then echo 'Nested dashboard found'; exit 1; fi
          grep -q 'hubgrid' src/TramliBern/TramliBern.ino
          grep -q 'req.upload.onprogress' src/TramliBern/TramliBern.ino
          if grep -E 'server.authenticate|server.requestAuthentication|otaPassword' src/TramliBern/TramliBern.ino; then echo "::error::Unexpected auth remains"; exit 1; fi
          grep -q otaFromHomeWifi src/TramliBern/TramliBern.ino
          grep -q showWifiQR src/TramliBern/TramliBern.ino
      - uses: arduino/setup-arduino-cli@v2
      - name: Set up ESP32 and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "GFX Library for Arduino@1.6.0"
          arduino-cli lib install "XPT2046_Touchscreen@1.4"
          git clone --depth 1 https://github.com/ricmoo/QRCode.git /tmp/QRCode
          cp /tmp/QRCode/src/qrcode.c /tmp/QRCode/src/qrcode.h src/TramliBern/
          cp /tmp/QRCode/LICENSE.txt src/TramliBern/QRCode_LICENSE.txt
          sed -i 's/#include <qrcode.h>/#include "qrcode.h"/' src/TramliBern/TramliBern.ino
      - name: Compile RC35
        run: |
          mkdir -p build
          arduino-cli compile --jobs 1 --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --output-dir build --export-binaries src/TramliBern
      - name: Verify firmware size and package exact sources
        run: |
          test -s build/TramliBern.ino.bin
          size=$(stat -c '%s' build/TramliBern.ino.bin)
          echo "BIN_BYTES=$size"
          echo "OTA_SLOT=1966080"
          test "$size" -le 1966080
          mkdir -p deliver/ArduinoSource
          cp -a src/TramliBern/. deliver/ArduinoSource/
          cp build/TramliBern.ino.bin deliver/TramliBern_RC35.ino.bin
          sha256sum deliver/TramliBern_RC35.ino.bin > deliver/SHA256SUMS.txt
          printf "Build commit: %s\nESP32 core: 3.3.2\nOTA transition test: RC34 to RC35; source change: version marker only\n" "$GITHUB_SHA" > deliver/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TramliBern_RC35_HomeCross_compiled
          path: deliver/
          if-no-files-found: error

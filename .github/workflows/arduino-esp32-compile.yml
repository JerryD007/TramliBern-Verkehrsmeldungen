name: Arduino ESP32 compile test

on:
  push:
    branches: ['test/arduino-esp32-compile']
    paths: ['firmware/**', 'ci/**', '.github/workflows/arduino-esp32-compile.yml']
  pull_request:
    paths: ['firmware/**', 'ci/**', '.github/workflows/arduino-esp32-compile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arduino-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install pinned core and libraries
        run: bash ci/install.sh
      - name: Compile and record memory usage
        run: bash ci/compile.sh
      - name: Save logs and memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arduino-esp32-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30
